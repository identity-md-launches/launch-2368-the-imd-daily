# The IMD Daily file service plus Caddy for automatic HTTPS on a free subdomain.
services:
  files:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8080"
      TRUST_PROXY: "1"
    volumes:
      - imd-daily-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      files:
        condition: service_healthy
volumes:
  imd-daily-data:
  caddy-data:
  caddy-config:
